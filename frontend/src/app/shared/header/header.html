<header class="fixed top-0 left-0 z-50 w-full border-b border-white/10 bg-black">
    <div class="mx-auto max-w-7xl px-4 py-4 sm:px-6 lg:px-8">

        @if (esRegistro()) {

        <div class="flex items-center justify-center">
            <a routerLink="/"
                class="text-lg font-bold tracking-tight text-white transition duration-300 hover:text-[#C6A66B]">
                GCO Fidelización
            </a>
        </div>

        } @else {

        <div class="flex items-center justify-between">
            <a routerLink="/"
                class="text-lg font-bold tracking-tight text-white transition duration-300 hover:text-[#C6A66B]">
                GCO Fidelización
            </a>

            <a routerLink="/registro"
                class="bg-white px-6 py-2.5 text-sm font-bold text-black transition duration-300 hover:bg-[#C6A66B]">
                Registrarme
            </a>
        </div>

        }

    </div>
</header>
